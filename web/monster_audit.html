<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>雷霆之石 · 怪物能力审核</title>
  <link rel="stylesheet" href="/monster-audit.css">
  <script src="/monster-audit.js" defer></script>
</head>
<body>
  <header>
    <nav><a href="/">规则配置</a><a href="/effect-lab">效果实验台</a><span>MONSTER REVIEW</span></nav>
    <h1>怪物能力审核</h1>
    <p>对照卡面左侧符号，逐条核查效果的生效区域与时点。下方中文解释来自当前运行规则。</p>
    <p class="notice">没有前缀的词条已特别标记。请先核对它属于手牌战利品还是怪物能力；“已绑定”只说明代码中有实现，卡面语义仍需审核。</p>
    <div id="totals" class="totals" aria-live="polite"></div>
  </header>
  <section class="toolbar" aria-label="审核筛选">
    <label>查找<input id="search" type="search" placeholder="编号、名字、标签或效果文字"></label>
    <label>当前生效范围<select id="scope"><option value="">全部怪物</option></select></label>
    <label>审核状态<select id="review-filter"><option value="">全部</option><option value="pending">待审核</option><option value="issue">有问题</option><option value="confirmed">已确认</option></select></label>
    <label class="check"><input id="ambiguous-only" type="checkbox">仅看含无前缀词条的怪物</label>
    <button id="next-pending" type="button">下一张待审核</button>
    <button id="export" type="button">导出审核记录</button>
    <label class="import-button">导入记录<input id="import" type="file" accept=".json,application/json"></label>
  </section>
  <p class="storage-note">审核与备注保存在本浏览器中，可导出备份。标记和建议修改会留作审核记录，规则文件、CSV 与数据库需在后续确认后统一修改。</p>
  <p id="status" role="status" aria-live="polite">正在读取怪物能力…</p>
  <main>
    <aside><h2>怪物目录 <small id="visible-count"></small></h2><div id="index"></div></aside>
    <section id="cards" aria-label="怪物卡牌与能力"></section>
  </main>
  <dialog id="image-dialog">
    <form method="dialog"><button autofocus aria-label="关闭卡图">关闭 ×</button></form>
    <img id="large-image" alt="怪物卡图">
    <p id="image-caption"></p>
  </dialog>
</body>
</html>
