<!doctype html>
<html lang="zh-CN">
<head>
  <script type="module" src="/src/app/asset-cache.ts"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172631"><title>雷霆之石 · 个人设置</title>
  <link rel="stylesheet" href="/src/shared/styles/global.css"><link rel="stylesheet" href="/src/pages/profile/style.css">
  <script type="module" src="/src/pages/profile/index.ts"></script>
</head>
<body>
  <header id="profile-header" class="masthead">
    <div class="masthead-inner"><a class="brand" href="/play?view=room"><span class="brand-mark" aria-hidden="true">ϟ</span><span><strong>雷霆之石</strong><small>THUNDERSTONE</small></span></a><a class="profile-back" href="/play?view=room">返回大厅／房间</a></div>
    <div class="hero-copy"><p class="eyebrow">冒险者档案</p><h1>个人设置</h1><p>设置你的名称与头像，让伙伴们在牌桌上认出你。</p></div>
  </header>
  <main id="profile-main" class="profile-shell">
    <p id="profile-notice" class="profile-notice" role="status" aria-live="polite">正在读取账号…</p>
    <button id="profile-retry" class="button secondary" type="button" hidden>重新加载</button>
    <form id="profile-form" class="panel">
      <fieldset id="profile-fields" disabled>
        <section class="profile-avatar-section" aria-label="玩家头像">
          <button id="avatar-pick" class="profile-avatar-button" type="button" aria-label="选择头像"><span id="profile-avatar"></span><span class="profile-avatar-edit">更换头像</span></button>
          <p class="muted">PNG、JPEG 或 WebP，最大 5 MB。选择后可裁剪，保存更改后生效。</p>
          <button id="avatar-reset" class="text-button" type="button" hidden>撤销头像更改</button>
          <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </section>
        <div class="profile-fields">
          <label for="profile-username">玩家名称<input id="profile-username" name="username" autocomplete="nickname" maxlength="64" required></label>
          <label for="profile-email">邮箱<input id="profile-email" name="email" type="email" autocomplete="email" readonly aria-describedby="email-readonly-hint"><small id="email-readonly-hint">邮箱作为登录账号，不可修改。</small></label>
          <div class="profile-password-fields">
            <label for="profile-password">新密码<input id="profile-password" name="password" type="password" autocomplete="new-password" placeholder="留空则保留当前密码" aria-describedby="password-hint"></label>
            <label for="profile-password-confirm">确认新密码<input id="profile-password-confirm" name="confirm-password" type="password" autocomplete="new-password" placeholder="再次输入新密码"></label>
          </div>
          <p id="password-hint" class="muted">密码需为 8～72 个 UTF-8 字节。修改密码后需要重新登录。</p>
        </div>
        <div class="profile-actions"><a class="profile-back button secondary" href="/play?view=room">取消</a><button id="profile-save" class="button primary" type="submit" disabled>保存更改</button></div>
      </fieldset>
    </form>
  </main>
  <section id="avatar-crop-dialog" class="browse-dialog avatar-crop-dialog" role="dialog" aria-modal="true" aria-labelledby="avatar-crop-title" hidden>
    <div class="browse-dialog-panel panel">
      <header class="browse-dialog-heading masthead"><div class="browse-dialog-heading-group"><h2 id="avatar-crop-title">裁剪头像</h2></div><button id="avatar-crop-close" class="browse-dialog-close button secondary" type="button">关闭 ×</button></header>
      <div class="browse-dialog-body avatar-crop-body">
        <p class="muted">拖动图片调整位置，滚动滚轮缩放。圆框内为头像显示区域。</p>
        <div class="avatar-crop-frame"><canvas id="avatar-crop-canvas" width="512" height="512" tabindex="0" aria-label="头像裁剪预览，可拖动图片、滚轮缩放，或按加减键缩放、0 复位"></canvas></div>
        <div class="avatar-crop-tools"><button id="avatar-crop-left" class="button secondary" type="button" aria-label="向左旋转 90 度">↶</button><button id="avatar-crop-right" class="button secondary" type="button" aria-label="向右旋转 90 度">↷</button><button id="avatar-crop-reset" class="button secondary" type="button">复位</button></div>
        <p id="avatar-crop-error" class="profile-notice" role="status" hidden></p>
        <div class="profile-actions"><button id="avatar-crop-cancel" class="button secondary" type="button">取消</button><button id="avatar-crop-use" class="button primary" type="button">确认</button></div>
      </div>
    </div>
  </section>
</body>
</html>
